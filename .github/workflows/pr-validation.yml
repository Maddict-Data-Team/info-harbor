name: PR Validation (offline, non-deploying)

# Runs on every pull request and on pushes to feature/* branches. Does
# NOT authenticate to Google Cloud, does NOT deploy, and does NOT touch
# main's deployment workflow (.github/workflows/deploy.yml is unchanged
# and continues to deploy projects/automation on every push to main --
# see docs/modernization-spec.md, "Why deploy-on-push-to-main should be
# replaced", for why that remains a known risk to fix in a later branch).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Guardrail -- fail if any test imports live GCP client libs at call time
        run: |
          echo "This is enforced by tests/conftest.py's autouse "
          echo "_block_real_cloud_clients fixture, which monkeypatches the "
          echo "Google client constructors to raise. See AGENTS.md."

      - name: Run offline test suite
        run: python -m pytest -q
        env:
          # Defense in depth: if any code path tries to read real
          # credentials, make sure no ADC/GOOGLE_APPLICATION_CREDENTIALS
          # is present in this job to pick up.
          GOOGLE_APPLICATION_CREDENTIALS: ""

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check every tracked Python file (syntax only)
        run: |
          python -m compileall -q projects shared ui tests campaign_manager.py

      - name: Confirm tests/ is not re-ignored by .gitignore
        run: |
          if git check-ignore -q tests/conftest.py; then
            echo "::error::tests/ is gitignored again -- see docs/code-audit.md IH-037"
            exit 1
          fi

      - name: Confirm no keys/ directory is committed
        run: |
          if git ls-files | grep -q '^keys/'; then
            echo "::error::A file under keys/ is tracked by git -- this must never happen"
            exit 1
          fi
          echo "OK: no tracked files under keys/"
